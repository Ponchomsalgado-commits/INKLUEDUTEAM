# Entorno de PRODUCCIÓN / SERVIDOR: todo el sistema con un solo comando.
# Uso: docker compose -f docker-compose.prod.yml up -d --build
# Guía completa: docs/DESPLIEGUE.md
#
# Solo el servicio "web" se publica (puerto WEB_PORT, 80 por defecto):
#   http://servidor/          -> aplicación web (React compilada, servida por Nginx)
#   http://servidor/api/v1/   -> API (Nginx la reenvía al contenedor api)
# PostgreSQL, MinIO y la API quedan solo en la red interna de Docker.
services:
  web:
    build:
      context: ./web
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: ./backend
      target: production
    env_file: .env
    environment:
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - "pg_data:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: bitnamilegacy/minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - "minio_data:/bitnami/minio/data"
    restart: unless-stopped

volumes:
  pg_data:
  minio_data:
