# Sirve la web compilada y reenvía /api/ al backend (mismo papel que el proxy de Vite en desarrollo)
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Rutas de la SPA (/login, /register...) devuelven index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los archivos con hash de Vite pueden cachearse por mucho tiempo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
