version: "3.9"

services:
  api:
    build: ./backend
    ports:
      - "3000:3000"
    env_file: .env
    depends_on:
      - postgres
      - minio
    volumes:
      - "./backend:/app"

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: tdah_user
      POSTGRES_PASSWORD: tdah_pass
      POSTGRES_DB: tdah_db
    ports:
      - "5432:5432"
    volumes:
      - "pg_data:/var/lib/postgresql/data"

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_pass123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - "minio_data:/data"

volumes:
  pg_data:
  minio_data:
