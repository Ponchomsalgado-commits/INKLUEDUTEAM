# Entorno de DESARROLLO: API con recarga en caliente + PostgreSQL + MinIO.
# Uso: docker compose up --build        (la web y el móvil se corren aparte, ver README)
# Para servidor usa docker-compose.prod.yml.
services:
  api:
    build:
      context: ./backend
      target: development
    ports:
      - "3000:3000"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    volumes:
      - "./backend:/app"
      - "/app/node_modules"

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - "pg_data:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: bitnamilegacy/minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BROWSER: "on"
      MINIO_SERVER_URL: "http://localhost:9000"
    ports:
      - "9000:9000"
      - "${MINIO_CONSOLE_PORT:-9002}:9001"
    volumes:
      - "minio_data:/bitnami/minio/data"

volumes:
  pg_data:
  minio_data:
